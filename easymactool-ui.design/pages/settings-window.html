    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.5rem;
  --radius-md: 0.8rem;
  --radius-lg: 1.2rem;
  --apple-radius-sm: 0.5rem;
  --apple-radius-md: 0.8rem;
  --apple-radius-lg: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

            /* ===== Settings window shell ===== */
            .settings-window {
                width: 900px;

                border-radius: 12px;

                background: var(--apple-background);
                overflow: hidden;

                width: 180px;
                flex-shrink: 0;

                display: flex;
                flex-direction: column;
            }
            .sidebar-item {
                display: flex;

                gap: 8px;

                padding: 0 10px;
                border-radius: 6px;

                line-height: 1;
                color: var(--apple-sidebar-foreground);
                cursor: default;
                transition: background 0.15s ease;
            }
            .sidebar-item:hover { background: var(--apple-sidebar-accent); }
            .sidebar-item.selected {
                background: var(--apple-primary);
                color: var(--apple-primary-foreground);
            }
            .sidebar-item.selected:hover { background: var(--apple-primary); }
            .sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; }
            /* ===== Detail panel ===== */
            .detail-panel {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                background: var(--apple-background);
            }
            .detail-toolbar {
                height: 40px;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                padding: 0 20px;
                border-bottom: 1px solid var(--apple-border);
                font-size: 13px;
                font-weight: 600;
                color: var(--apple-foreground);
            }
            .detail-content {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 20px;
                padding: 20px 24px;
                overflow: hidden;
            }
            /* ===== Section headers & captions ===== */
            .section-header {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 15px;
                font-weight: 600;
                color: var(--apple-foreground);
            }
            .section-header svg { width: 18px; height: 18px; color: var(--apple-muted-foreground); }
            .section-caption {
                font-size: 12px;
                line-height: 1.4;
                color: var(--apple-muted-foreground);
                margin-top: 6px;
            }
            .divider { height: 1px; background: var(--apple-border); }
            /* ===== Segmented control ===== */
            .segmented {
                display: inline-flex;
                background: var(--apple-secondary);
                border-radius: 8px;
                padding: 2px;
                gap: 2px;
            }
            .segment {
                -webkit-appearance: none;
                appearance: none;
                border: none;
                background: transparent;
                font-family: inherit;
                font-size: 13px;
                line-height: 1;
                padding: 5px 12px;
                border-radius: 6px;
                color: var(--apple-muted-foreground);
                white-space: nowrap;
                cursor: default;
                transition: background 0.15s ease, color 0.15s ease;
            }
            .segment.selected {
                background: var(--apple-primary);
                color: var(--apple-primary-foreground);
                box-shadow: var(--shadow-sm);
            }
            /* ===== Split layout (shortcut section) ===== */
            .split-layout {
                flex: 1;
                min-height: 0;
                display: flex;
                border: 1px solid var(--apple-border);
                border-radius: 8px;
                overflow: hidden;
                background: var(--apple-background);
            }
            .shortcut-list-col {
                width: 180px;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                background: var(--apple-secondary);
            }
            .shortcut-list {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 6px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .shortcut-item {
                padding: 8px 10px;
                border-radius: 6px;
                cursor: default;
            }
            .shortcut-item.selected {
                background: var(--apple-primary);
                color: var(--apple-primary-foreground);
            }
            .shortcut-item-name {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 13px;
                font-weight: 500;
            }
            .shortcut-badge {
                display: inline-flex;
                align-items: center;
                padding: 1px 6px;
                border-radius: 999px;
                font-size: 10px;
                font-weight: 500;
                line-height: 1.4;
                background: rgba(0, 122, 255, 0.15);
                color: var(--brand-700);
            }
            .shortcut-item.selected .shortcut-badge {
                background: rgba(255, 255, 255, 0.22);
                color: rgba(255, 255, 255, 0.95);
            }
            .shortcut-key {
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--apple-muted-foreground);
                margin-top: 2px;
            }
            .shortcut-item.selected .shortcut-key { color: rgba(255, 255, 255, 0.8); }
            .shortcut-toolbar {
                display: flex;
                gap: 4px;
                padding: 6px 8px;
                border-top: 1px solid var(--apple-border);
                background: var(--apple-secondary);
            }
            .icon-btn {
                -webkit-appearance: none;
                appearance: none;
                border: none;
                background: transparent;
                width: 24px;
                height: 22px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 5px;
                color: var(--apple-foreground);
                cursor: default;
            }
            .icon-btn:hover { background: var(--apple-sidebar-accent); }
            .icon-btn.disabled {
                color: var(--apple-muted-foreground);
                opacity: 0.4;
            }
            .icon-btn.disabled:hover { background: transparent; }
            .icon-btn svg { width: 15px; height: 15px; }
            .vdivider { width: 1px; flex-shrink: 0; background: var(--apple-border); }
            .shortcut-detail {
                flex: 1;
                min-width: 0;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                background: var(--apple-background);
            }
            /* ===== Form sections (inset grouped) ===== */
            .form-group { display: flex; flex-direction: column; gap: 6px; }
            .form-group-label {
                font-size: 12px;
                font-weight: 500;
                color: var(--apple-muted-foreground);
                padding-left: 4px;
            }
            .form-section {
                background: var(--apple-secondary);
                border-radius: 8px;
                overflow: hidden;
            }
            .form-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 9px 14px;
                min-height: 36px;
            }
            .form-row + .form-row { border-top: 1px solid var(--apple-border); }
            .form-row-label { font-size: 13px; color: var(--apple-foreground); }
            .form-row-value { font-size: 13px; color: var(--apple-muted-foreground); }
            .radio-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 14px;
                min-height: 36px;
                font-size: 13px;
                color: var(--apple-foreground);
            }
            .radio-row + .radio-row { border-top: 1px solid var(--apple-border); }
            /* ===== Key recorder ===== */
            .key-recorder {
                -webkit-appearance: none;
                appearance: none;
                display: inline-flex;
                align-items: center;
                padding: 4px 10px;
                border: 1px solid var(--apple-border);
                border-radius: 6px;
                background: var(--apple-background);
                font-family: var(--font-mono);
                font-size: 13px;
                color: var(--apple-foreground);
                box-shadow: var(--shadow-xs);
                cursor: default;
            }
            /* ===== macOS toggle ===== */
            .toggle {
                position: relative;
                width: 38px;
                height: 22px;
                border-radius: 999px;
                background: var(--background-300);
                flex-shrink: 0;
                transition: background 0.2s ease;
            }
            .toggle.on { background: var(--state-success); }
            .toggle-knob {
                position: absolute;
                top: 2px;
                left: 2px;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: #ffffff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
                transition: transform 0.2s ease;
            }
            .toggle.on .toggle-knob { transform: translateX(16px); }
            /* ===== Radio ===== */
            .radio {
                width: 15px;
                height: 15px;
                border-radius: 50%;
                border: 1.5px solid var(--background-400);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .radio.selected { border-color: var(--apple-primary); }
            .radio-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--apple-primary);
            }
        </style>

        <div id="settings-window" class="settings-window">
            <!-- ===== Left sidebar ===== -->
            <aside id="sidebar" class="sidebar">
                <div class="flex items-center gap-2 px-4 pt-3 pb-1">

                    <span class="block h-3 w-3 rounded-full" style="background:#febc2e;"></span>
                    <span class="block h-3 w-3 rounded-full" style="background:#28c840;"></span>
                </div>
                <div class="px-4 pt-2 pb-3">
                    <div class="text-[13px] font-semibold text-sidebar-foreground">EasyMacTool</div>
                </div>
                <nav class="flex flex-col gap-0.5 px-2">
                    <a class="sidebar-item selected">
                        <i data-lucide="layout-grid"></i>
                        <span>窗口切换</span>
                    </a>
                    <a class="sidebar-item">
                        <i data-lucide="clipboard"></i>
                        <span>剪切板</span>
                    </a>
                    <a class="sidebar-item">
                        <i data-lucide="shield"></i>
                        <span>权限设置</span>
                    </a>
                    <a class="sidebar-item">
                        <i data-lucide="info"></i>
                        <span>关于</span>
                    </a>
                </nav>
                <div class="mt-auto px-4 py-3 text-[11px] text-muted-foreground">v1.0.0</div>
            </aside>

            <!-- ===== Right detail panel ===== -->
            <section id="detail-panel" class="detail-panel">
                <div class="detail-toolbar">窗口切换</div>
                <div class="detail-content">
                    <!-- ----- Display target section ----- -->
                    <div id="display-target-section">
                        <div class="section-header">
                            <i data-lucide="monitor"></i>
                            <span>多屏幕</span>
                        </div>
                        <div class="mt-2">
                            <div class="segmented" style="max-width:480px;">
                                <button class="segment selected">活跃屏幕</button>
                                <button class="segment">包含鼠标的屏幕</button>
                                <button class="segment">包含菜单栏的屏幕</button>
                            </div>
                        </div>
                        <div class="section-caption">切换窗口面板在哪个屏幕弹出。当前：活跃屏幕</div>
                    </div>

                    <div class="divider"></div>

                    <!-- ----- Shortcut section (split) ----- -->
                    <div id="shortcut-section" class="flex flex-col min-h-0" style="flex:1;">
                        <div class="section-header">
                            <i data-lucide="keyboard"></i>
                            <span>快捷键</span>
                        </div>
                        <div class="split-layout mt-2">
                            <!-- Left: shortcut list -->
                            <div id="shortcut-list" class="shortcut-list-col">
                                <div class="shortcut-list">
                                    <div class="shortcut-item selected">
                                        <div class="shortcut-item-name">
                                            <span>默认</span>
                                            <span class="shortcut-badge">默认</span>
                                        </div>
                                        <div class="shortcut-key">⌘⇥</div>
                                    </div>
                                    <div class="shortcut-item">
                                        <div class="shortcut-item-name">
                                            <span>快捷键 2</span>
                                        </div>
                                        <div class="shortcut-key">⌘⇧⇥</div>
                                    </div>
                                </div>
                                <div class="shortcut-toolbar">
                                    <button class="icon-btn" title="添加"><i data-lucide="plus"></i></button>
                                    <button class="icon-btn disabled" title="删除" disabled><i data-lucide="minus"></i></button>
                                </div>
                            </div>

                            <div class="vdivider"></div>

                            <!-- Right: detail editor -->
                            <div id="shortcut-detail" class="shortcut-detail">
                                <!-- 基本信息 -->
                                <div class="form-group">
                                    <div class="form-group-label">基本信息</div>
                                    <div class="form-section">
                                        <div class="form-row">
                                            <span class="form-row-label">名称</span>
                                            <span class="form-row-value">默认</span>
                                        </div>
                                        <div class="form-row">
                                            <span class="form-row-label">快捷键</span>
                                            <button class="key-recorder">⌘⇥</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- 预览图大小 -->
                                <div class="form-group">
                                    <div class="form-group-label">预览图大小</div>
                                    <div class="form-section">
                                        <div class="form-row">
                                            <div class="segmented">
                                                <button class="segment selected">小</button>
                                                <button class="segment">中</button>
                                                <button class="segment">大</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="section-caption">此快捷键切换窗口时的缩略图大小。当前：小</div>
                                </div>

                                <!-- 显示窗口 -->
                                <div class="form-group">
                                    <div class="form-group-label">显示窗口</div>
                                    <div class="form-section">
                                        <div class="form-row">

                                            <span class="toggle"><span class="toggle-knob"></span></span>
                                        </div>
                                        <div class="form-row">

                                            <span class="toggle"><span class="toggle-knob"></span></span>
                                        </div>
                                    </div>
                                    <div class="section-caption">最小化和隐藏的窗口无法实时捕获预览，将显示应用图标和窗口标题</div>
                                </div>

                                <!-- 释放行为 -->
                                <div class="form-group">
                                    <div class="form-group-label">释放行为</div>
                                    <div class="form-section">
                                        <div class="radio-row">
                                            <span class="radio"></span>
                                            <span>释放后聚焦</span>
                                        </div>
                                        <div class="radio-row">
                                            <span class="radio selected"><span class="radio-dot"></span></span>
                                            <span>按住（Enter 确认）</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
