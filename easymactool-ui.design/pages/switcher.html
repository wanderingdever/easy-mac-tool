    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));
  --apple-sidebar-accent-foreground: var(--sidebar-accent-foreground, var(--accent-foreground, var(--foreground)));

/* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.5rem;
  --radius-md: 0.8rem;
  --radius-lg: 1.2rem;
  --apple-radius-sm: 0.5rem;
  --apple-radius-md: 0.8rem;
  --apple-radius-lg: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

      <style id="critical-layout">
        /* ===== Backdrop (desktop dimming) ===== */
        .switcher-backdrop {
          position: fixed;
          inset: 0;
          background: linear-gradient(135deg, #5b7fff 0%, #8a5fff 45%, #c45fff 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 5vh 40px;
          z-index: 50;
        }
        .switcher-backdrop::before {
          content: "";
          position: absolute;
          inset: 0;
          background: rgba(0, 0, 0, 0.25);
        }

        /* ===== Frosted glass panel ===== */
        .switcher-panel {
          position: relative;
          z-index: 1;
          width: 100%;
          max-width: 900px;
          padding: 20px;
          border-radius: 24px;
          background: color-mix(in srgb, var(--apple-background) 72%, transparent);
          border: 1px solid color-mix(in srgb, var(--apple-border) 35%, transparent);
          box-shadow: var(--shadow-2xl), inset 0 1px 0 rgba(255, 255, 255, 0.55);
          -webkit-backdrop-filter: blur(30px) saturate(180%);
          backdrop-filter: blur(30px) saturate(180%);
          font-family: var(--font-sans);
        }

        /* ===== Header ===== */
        .switcher-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 2px 6px 14px;
        }
        .switcher-title {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 13px;
          font-weight: 600;
          color: var(--apple-foreground);
          letter-spacing: 0.01em;
        }
        .switcher-title .dot {
          width: 7px;
          height: 7px;
          border-radius: 999px;
          background: var(--apple-primary);
          box-shadow: 0 0 0 3px color-mix(in srgb, var(--apple-primary) 25%, transparent);
        }
        .switcher-count {
          font-size: 12px;
          color: var(--apple-muted-foreground);
          font-variant-numeric: tabular-nums;
        }

        /* ===== Thumbnail flow grid ===== */
        .thumbnail-grid {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          align-items: flex-start;
        }

        /* ===== Window card ===== */
        .window-card {
          flex: 1 1 200px;
          min-width: 180px;
          max-width: 220px;
          padding: 10px;
          border-radius: 14px;
          background: transparent;
          border: 1px solid color-mix(in srgb, var(--apple-foreground) 7%, transparent);
          position: relative;
          cursor: default;
          transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
        }
        .window-card:hover {
          background: color-mix(in srgb, var(--apple-foreground) 4%, transparent);
        }
        .window-card.is-selected {
          padding: 9px;
          border: 2px solid var(--apple-primary);
          background: color-mix(in srgb, var(--apple-primary) 25%, transparent);
          box-shadow: 0 0 0 1px color-mix(in srgb, var(--apple-primary) 20%, transparent);
        }
        .window-card.is-hover {
          border: 1.5px solid color-mix(in srgb, var(--apple-primary) 55%, transparent);
          background: color-mix(in srgb, var(--apple-primary) 8%, transparent);
        }

        .window-card-head {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 8px;
          min-width: 0;
        }
        .app-icon {
          width: 18px;
          height: 18px;
          border-radius: 5px;
          flex: none;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
        .app-icon svg {
          width: 11px;
          height: 11px;
          stroke-width: 2.4;
        }
        .window-card-title {
          font-size: 13px;
          font-weight: 500;
          color: var(--apple-foreground);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          line-height: 1.2;
          min-width: 0;
        }

        /* ===== Thumbnail frame ===== */
        .window-thumb {
          width: 100%;
          border-radius: 10px;
          overflow: hidden;
          position: relative;
          border: 1px solid color-mix(in srgb, var(--apple-foreground) 6%, transparent);
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        .window-card.is-selected .window-thumb {
          border: 1.5px solid var(--apple-primary);
          box-shadow: 0 0 0 1px color-mix(in srgb, var(--apple-primary) 30%, transparent);
        }
        .thumb { width: 100%; position: relative; }

        /* ===== State badges ===== */
        .state-badge {
          position: absolute;
          right: 8px;
          bottom: 8px;
          width: 22px;
          height: 22px;
          border-radius: 999px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: color-mix(in srgb, var(--apple-background) 92%, transparent);
          border: 1px solid color-mix(in srgb, var(--apple-foreground) 12%, transparent);
          box-shadow: var(--shadow-sm);
          color: var(--apple-foreground);
          z-index: 3;
        }
        .state-badge svg { width: 13px; height: 13px; stroke-width: 2.2; }
        .state-badge.is-min { color: var(--apple-muted-foreground); }

        /* ===== Hint bar ===== */
        .switcher-hints {
          margin-top: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 18px;
          font-size: 11.5px;
          color: var(--apple-muted-foreground);
        }
        .hint-key { display: inline-flex; align-items: center; gap: 6px; }
        .kbd {
          font-family: var(--font-sans);
          font-size: 10.5px;
          font-weight: 600;
          padding: 3px 7px;
          border-radius: 5px;
          background: color-mix(in srgb, var(--apple-foreground) 7%, transparent);
          border: 1px solid color-mix(in srgb, var(--apple-foreground) 10%, transparent);
          color: var(--apple-foreground);
          line-height: 1;
        }

        /* ===== Thumbnail scene primitives ===== */
        .tl { display: flex; gap: 5px; }
        .tl i { width: 7px; height: 7px; border-radius: 999px; display: block; }

        /* Safari */
        .thumb-safari { aspect-ratio: 16 / 10; background: #f2f2f7; }
        .thumb-safari .sf-bar {
          height: 30%;
          background: linear-gradient(#d8d8de, #e8e8ee);
          display: flex;
          align-items: center;
          gap: 7px;
          padding: 0 8px;
          border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }
        .thumb-safari .sf-url {
          flex: 1;
          height: 42%;
          background: #fff;
          border-radius: 99px;
          box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
        }
        .thumb-safari .sf-body { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .thumb-safari .sf-hero { height: 26px; border-radius: 5px; background: linear-gradient(90deg, #007aff, #4da0ff); opacity: .85; }
        .thumb-safari .sf-row { height: 5px; border-radius: 3px; background: #c7c7cc; }

        /* Xcode */
        .thumb-xcode { aspect-ratio: 16 / 10; background: #1e1e1e; display: flex; }
        .thumb-xcode .xc-side {
          width: 26%;
          background: #252526;
          border-right: 1px solid #333;
          padding: 6px 5px;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .thumb-xcode .xc-side i { height: 5px; border-radius: 2px; background: #3a3a3a; }
        .thumb-xcode .xc-side i:nth-child(odd) { background: #2f5f8f; }
        .thumb-xcode .xc-code {
          flex: 1;
          padding: 7px 8px;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .thumb-xcode .xc-code i { height: 4px; border-radius: 2px; display: block; }

        /* Finder */
        .thumb-finder { aspect-ratio: 4 / 3; background: #fff; display: flex; }
        .thumb-finder .fd-side {
          width: 30%;
          background: #f2f2f7;
          border-right: 1px solid #e5e5ea;
          padding: 7px 6px;
          display: flex;
          flex-direction: column;
          gap: 5px;
        }
        .thumb-finder .fd-side i { height: 5px; border-radius: 3px; background: #d1d1d6; }
        .thumb-finder .fd-side i:first-child { background: #007aff; width: 70%; }
        .thumb-finder .fd-main { flex: 1; padding: 7px; display: flex; flex-direction: column; gap: 6px; }
        .thumb-finder .fd-row { display: flex; align-items: center; gap: 6px; }
        .thumb-finder .fd-row b { width: 9px; height: 7px; border-radius: 2px; background: #5ac8fa; flex: none; }
        .thumb-finder .fd-row i { height: 5px; border-radius: 3px; background: #c7c7cc; flex: 1; }

        /* Terminal */
        .thumb-term {
          aspect-ratio: 4 / 3;
          background: #0c0c0c;
          padding: 8px 9px;
          display: flex;
          flex-direction: column;
          gap: 5px;
        }
        .thumb-term .term-bar { height: 7px; display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
        .thumb-term .term-bar i { width: 6px; height: 6px; border-radius: 999px; }
        .thumb-term .term-line { height: 5px; display: flex; align-items: center; gap: 5px; }
        .thumb-term .term-line .prompt { width: 7px; height: 5px; background: #34c759; flex: none; border-radius: 1px; }
        .thumb-term .term-line .txt { height: 5px; background: #30c020; border-radius: 1px; }
        .thumb-term .cursor { width: 5px; height: 7px; background: #34c759; flex: none; }

        /* Slack */
        .thumb-slack { aspect-ratio: 16 / 10; background: #fff; display: flex; }
        .thumb-slack .sl-side {
          width: 24%;
          background: #3a0c4e;
          padding: 6px 5px;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .thumb-slack .sl-side i { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.25); }
        .thumb-slack .sl-side i:nth-child(2) { background: #ecb22e; }
        .thumb-slack .sl-main { flex: 1; padding: 7px; display: flex; flex-direction: column; gap: 7px; }
        .thumb-slack .sl-msg { display: flex; align-items: center; gap: 6px; }
        .thumb-slack .sl-msg b { width: 10px; height: 10px; border-radius: 999px; flex: none; }
        .thumb-slack .sl-msg .lines { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .thumb-slack .sl-msg .lines i { height: 4px; border-radius: 2px; background: #e1e1e6; }

        /* Notes */
        .thumb-notes {
          aspect-ratio: 3 / 4;
          background: linear-gradient(#fffdf5, #fff7e0);
          padding: 9px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .thumb-notes .nt-title { height: 7px; width: 70%; border-radius: 2px; background: #e8c64a; }
        .thumb-notes .nt-line { height: 4px; border-radius: 2px; background: #efe2b0; }
        .thumb-notes .nt-line.w90 { width: 90%; }
        .thumb-notes .nt-line.w70 { width: 70%; }
        .thumb-notes .nt-line.w50 { width: 50%; }

        /* Messages */
        .thumb-msg { aspect-ratio: 4 / 3; background: #fff; display: flex; }
        .thumb-msg .ms-side {
          width: 30%;
          background: #f2f2f7;
          border-right: 1px solid #e5e5ea;
          padding: 6px 5px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .thumb-msg .ms-side .ms-item { display: flex; gap: 5px; align-items: center; }
        .thumb-msg .ms-side .ms-item b { width: 9px; height: 9px; border-radius: 999px; background: #c7c7cc; flex: none; }
        .thumb-msg .ms-side .ms-item i { height: 4px; border-radius: 2px; background: #c7c7cc; flex: 1; }
        .thumb-msg .ms-main {
          flex: 1;
          padding: 7px;
          display: flex;
          flex-direction: column;
          gap: 6px;
          justify-content: flex-end;
        }
        .thumb-msg .ms-bubble { height: 7px; border-radius: 6px; }
        .thumb-msg .ms-bubble.in { width: 55%; background: #e9e9eb; align-self: flex-start; }
        .thumb-msg .ms-bubble.out { width: 45%; background: #34c759; align-self: flex-end; }

        /* Music */
        .thumb-music {
          aspect-ratio: 16 / 9;
          background: linear-gradient(135deg, #2b1055, #7597de);
          padding: 9px 10px;
          display: flex;
          gap: 9px;
          align-items: center;
        }
        .thumb-music .album {
          width: 38%;
          aspect-ratio: 1;
          border-radius: 6px;
          background: linear-gradient(135deg, #ff6a88, #ff99ac);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
          flex: none;
        }
        .thumb-music .mu-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .thumb-music .mu-title { height: 6px; width: 70%; border-radius: 2px; background: rgba(255, 255, 255, 0.9); }
        .thumb-music .mu-sub { height: 4px; width: 50%; border-radius: 2px; background: rgba(255, 255, 255, 0.5); }
        .thumb-music .mu-prog {
          margin-top: 3px;
          height: 3px;
          border-radius: 2px;
          background: rgba(255, 255, 255, 0.25);
          position: relative;
        }
        .thumb-music .mu-prog::after {
          content: "";
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          width: 42%;
          background: #fff;
          border-radius: 2px;
        }
      </style>
