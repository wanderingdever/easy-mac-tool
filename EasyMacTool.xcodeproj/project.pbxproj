			);
			name = "Inject AppIcon";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/Assets.car",
				"$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/AppIcon.icns",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Compile Assets.xcassets manually — PBXFileSystemSynchronizedRootGroup\n# does NOT trigger actool, so Assets.car is never generated and macOS shows\n# the generic app icon (modern macOS 11+ requires CFBundleIconName pointing\n# at an asset catalog entry).\n#\n# We run actool ourselves to produce:\n#   - Assets.car  (referenced by CFBundleIconName = AppIcon)\n#   - AppIcon.icns (referenced by CFBundleIconFile = AppIcon, legacy fallback)\n# INFOPLIST_KEY_CFBundleIconName=AppIcon in build settings injects the key.\nset -e\nAPP=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app\"\nRES=\"${APP}/Contents/Resources\"\nOUT=\"${TMPDIR}/actool_out\"\nrm -rf \"$OUT\"; mkdir -p \"$OUT\"\nactool \\\n  --output-format human-readable-text \\\n  --output-partial-info-plist \"${OUT}/partial-info.plist\" \\\n  --app-icon AppIcon \\\n  --target-device mac \\\n  --platform macosx \\\n  --minimum-deployment-target \"${MACOSX_DEPLOYMENT_TARGET}\" \\\n  --compile \"$OUT\" \\\n  \"${SRCROOT}/EasyMacTool/Assets.xcassets\" >/dev/null\n# Inject the compiled Assets.car and AppIcon.icns into the app bundle.\ncp \"${OUT}/Assets.car\" \"${RES}/Assets.car\"\ncp \"${OUT}/AppIcon.icns\" \"${RES}/AppIcon.icns\"\necho \"[InjectAppIcon] Assets.car ($(stat -f%z \"${RES}/Assets.car\") bytes) + AppIcon.icns ($(stat -f%z \"${RES}/AppIcon.icns\") bytes) injected\"\n";
		};
